<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rong Logo Mark</title>
  <desc id="desc">A transparent version of the Rong logo based on the Chinese character 榮.</desc>

  <circle cx="320" cy="320" r="224" stroke="#FFFFFF" stroke-width="12"/>

  <circle cx="320" cy="320" r="200" stroke="#D1D5DB" stroke-width="2"/>

  <text
    x="320"
    y="318"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="248"
    font-weight="700"
    fill="#FFFFFF"
    font-family="Noto Serif SC, Songti SC, STSong, Source Han Serif SC, serif"
    letter-spacing="-6"
  >榮</text>

  <text
    x="320"
    y="452"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="42"
    font-weight="500"
    fill="#F3F4F6"
    fill-opacity="0.92"
    font-family="Noto Serif SC, Songti SC, STSong, Source Han Serif SC, serif"
    letter-spacing="2"
  >陸耕愚</text>

</svg>
